name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual "Run workflow" button. A squash-merge through the web UI does not always
  # spawn a run on main; this avoids pushing an empty commit just to re-trigger CI.
  workflow_dispatch:
  # Weekly, for the govulncheck job only: a Go patch release with security fixes turns this red
  # within a week even when nothing is pushed.
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # setup-go reads go.mod's `toolchain` line (falling back to the `go` line only when there is
      # none) and then exports GOTOOLCHAIN=local, so no later step can switch to another Go.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The toolchain is checked, not assumed: the Go this job actually runs must be the one the
      # toolchain line names. release.yml runs the same check, so what is tested is what ships.
      - name: Check toolchain
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          got=$(go env GOVERSION)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::running $got, but go.mod's toolchain line says '${want}'"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Every package's tests must compile for each OS logscry ships. Only Linux runs them, so
      # nothing else would notice a test file that calls a Linux-only helper (#157). amd64
      # stands for arm64: no file in the module has an arch constraint.
      - name: Compile tests (darwin, windows)
        run: |
          for goos in darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos GOARCH=amd64 go test -c -o "$RUNNER_TEMP/tests-$goos/" ./... || fail=1
            echo "::endgroup::"
          done
          [ -z "${fail:-}" ] || exit 1

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin an explicit golangci-lint v2 release built with Go >= 1.26 so it
          # doesn't refuse to lint a go.mod that targets 1.26.1. Do not use
          # "latest": the v1 line (built with Go 1.24) triggers a "Go language
          # version used to build golangci-lint is lower than targeted" error.
          version: v2.12.2

      # Coverage is measured here and only here: the number comes from this run, never from
      # a checked-in constant. Deliberately separate from the upload below, so a Codecov
      # outage, a rate limit, or a missing token still leaves the percentage in the log.
      # atomic covermode is what Codecov wants and the right mode for concurrent code; it
      # changes counter accounting, not the percentage.
      # This is also the job's one test run without -race, and it runs first: every test,
      # the anonymizer's superset gates included, runs here in full. A plain `go test` step
      # would run the same tests again for nothing, so there is none.
      - name: Test (coverage)
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          echo "Total coverage: $(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')" >> "$GITHUB_STEP_SUMMARY"

      # Separate from the run above rather than replacing it, so a failure says whether it is
      # a logic bug (the coverage step goes red first) or a data race (only this one does).
      # The concurrency model is load-bearing here — one goroutine owns the template map and
      # the LLM pool must never block ingest — so every test that starts a goroutine runs here.
      # The anonymizer's superset gates do not: they are pure. Each gate and its two subtests
      # run in parallel, every input gets fresh Mappers, and the corpus a gate built is only
      # read, so the detector has nothing to find in them; under it they took 5 of this step's
      # 5.5 minutes. They ran in full in the coverage step. SUPERSET_GATES names them exactly,
      # anchored, and two checks keep it honest before the run:
      #   - it must match as many tests as it names, so a renamed or removed gate fails here
      #     instead of silently running under -race again;
      #   - every test named like a gate, *MasksASupersetOf*, must be in it, so a new gate
      #     that was not added fails here with its name.
      # A new superset gate follows that name pattern and is added to SUPERSET_GATES.
      - name: Test (race detector)
        env:
          SUPERSET_GATES: '^(TestGluedRunMasksASupersetOfMain|TestDottedQuadMasksASupersetOfV01224|TestSlashUserinfoMasksASupersetOfV01225|TestJSONEscapeViewMasksASupersetOfV01226|TestPlaceholderReservationMasksASupersetOfV01227|TestVendorSecretChainMasksASupersetOfV01228|TestVendorKeyUnionMasksASupersetOfV01229)$'
        run: |
          gates=${SUPERSET_GATES#'^('}
          gates=$(tr '|' '\n' <<< "${gates%')$'}" | sort)
          named=$(go test -race -list "$SUPERSET_GATES" ./...)
          want=$(grep -c . <<< "$gates")
          got=$(grep -c '^Test' <<< "$named" || true)
          if [ "$got" -ne "$want" ]; then
            echo "::error::SUPERSET_GATES names $want tests but matches $got; was a gate renamed or removed?"
            exit 1
          fi
          convention=$(go test -race -list 'MasksASupersetOf' ./...)
          convention=$(grep '^Test' <<< "$convention" | sort || true)
          for t in $(comm -23 <(echo "$convention") <(echo "$gates")); do
            echo "::error::$t is named like a superset gate but is not in SUPERSET_GATES; add $t there"
            fail=1
          done
          for t in $(comm -13 <(echo "$convention") <(echo "$gates")); do
            echo "::error::$t is in SUPERSET_GATES but does not follow the *MasksASupersetOf* name pattern"
            fail=1
          done
          [ -z "${fail:-}" ] || exit 1
          go test -race -skip "$SUPERSET_GATES" ./...

      # Reporting, never a gate: fail_ci_if_error stays false so an external service cannot
      # turn this build red, and there is no minimum-coverage threshold on purpose.
      # A public repo uploads tokenless only while the Codecov org has "tokens required"
      # off. If the README coverage badge still reads "unknown" after this lands on the
      # default branch, the fix is to add a CODECOV_TOKEN repository secret — the reference
      # below is empty until then and picks it up with no change here.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # A known vulnerability that the code reaches and that has a fix we can take fails this job;
  # one with no fix only warns. It is its own job, so a red result here is visibly not the code
  # under review. It runs on the same toolchain as the build, so it scans the standard library
  # that ships.
  #   - Only symbol-level findings count: the vulnerable function is reachable from logscry.
  #   - Fails: a fixed version we can take. For the standard library, that is one on the
  #     toolchain's own minor line (Go 1.27 is not an option while golangci-lint is built with
  #     1.26), and the remedy is `go mod edit -toolchain=go1.26.N`. For a module, any fixed
  #     version.
  #   - Warns: no fixed version, or a standard-library fix only on a newer minor. There are none
  #     today: github.com/docker/docker's two left with the move to github.com/moby/moby (#152).
  #   - govulncheck failing to run (vuln.go.dev unreachable, say) fails the step. A check that
  #     did not run is not a pass; re-run it.
  # JSON mode exits 0 whatever it finds, so the verdict is jq's alone. Every finding also goes
  # into the step summary.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check toolchain
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          got=$(go env GOVERSION)
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::running $got, but go.mod's toolchain line says '${want}'"
            exit 1
          fi

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > vuln.json
          goversion=$(go env GOVERSION)
          line=$(sed -E 's/^go([0-9]+\.[0-9]+).*/v\1./' <<< "$goversion")
          findings=$(jq -r --arg line "$line" '
            select(.finding.trace[0].function != null) | .finding
            | (.fixed_version // "") as $fix
            | (if $fix == "" then "unfixed"
               elif .trace[0].module == "stdlib" and ($fix | startswith($line) | not) then "unfixed"
               else "fixable" end) as $verdict
            | [$verdict, .osv, .trace[0].module, (if $fix == "" then "none" else $fix end)]
            | @tsv' vuln.json | sort -u)
          {
            echo "### govulncheck on $goversion: symbol-level findings"
            echo
            echo "| OSV | module | fixed in | verdict |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          while IFS=$'\t' read -r verdict osv module fix; do
            [ -n "$verdict" ] || continue
            echo "| $osv | $module | $fix | $verdict |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$verdict" = fixable ]; then
              if [ "$module" = stdlib ]; then
                echo "::error::$osv: the standard library is fixed in go${fix#v}; raise go.mod's toolchain line with go mod edit -toolchain=go${fix#v} or newer"
              else
                echo "::error::$osv: $module is fixed in $fix"
              fi
              fail=1
            else
              if [ "$fix" = none ]; then
                echo "::warning::$osv: $module has no fixed version"
              else
                echo "::warning::$osv: the standard library is fixed only in go${fix#v}, off the go${line#v}x line"
              fi
            fi
          done <<< "$findings"
          exit $fail
