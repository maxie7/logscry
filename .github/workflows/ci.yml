name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin an explicit golangci-lint v2 release built with Go >= 1.26 so it
          # doesn't refuse to lint a go.mod that targets 1.26.1. Do not use
          # "latest": the v1 line (built with Go 1.24) triggers a "Go language
          # version used to build golangci-lint is lower than targeted" error.
          version: v2.12.2

      - name: Test
        run: go test ./...

      # Separate from the plain test run rather than replacing it: -race is several times
      # slower, and keeping both means a failure says whether it is a logic bug or a data
      # race. The concurrency model is load-bearing here — one goroutine owns the template
      # map and the LLM pool must never block ingest — so it is worth the extra minute.
      - name: Test (race detector)
        run: go test -race ./...

      # Coverage is measured here and only here: the number comes from this run, never from
      # a checked-in constant. Deliberately separate from the upload below, so a Codecov
      # outage, a rate limit, or a missing token still leaves the percentage in the log.
      # atomic covermode is what Codecov wants and the right mode for concurrent code; it
      # changes counter accounting, not the percentage.
      - name: Test (coverage)
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          echo "Total coverage: $(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')" >> "$GITHUB_STEP_SUMMARY"

      # Reporting, never a gate: fail_ci_if_error stays false so an external service cannot
      # turn this build red, and there is no minimum-coverage threshold on purpose.
      # A public repo uploads tokenless only while the Codecov org has "tokens required"
      # off. If the README coverage badge still reads "unknown" after this lands on the
      # default branch, the fix is to add a CODECOV_TOKEN repository secret — the reference
      # below is empty until then and picks it up with no change here.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
