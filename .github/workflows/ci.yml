name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin an explicit golangci-lint v2 release built with Go >= 1.26 so it
          # doesn't refuse to lint a go.mod that targets 1.26.1. Do not use
          # "latest": the v1 line (built with Go 1.24) triggers a "Go language
          # version used to build golangci-lint is lower than targeted" error.
          version: v2.12.2

      - name: Test
        run: go test ./...
